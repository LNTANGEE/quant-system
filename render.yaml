services:
  - type: web
    name: quant-system
    runtime: docker
    repo: https://github.com/LNTANGEE/quant-system.git
    branch: main
    plan: starter
    autoDeployTrigger: commit
    region: singapore
    numInstances: 1
    healthCheckPath: /
    disk:
      name: quant-system-data
      mountPath: /app/local_data
      sizeGB: 1
    envVars:
      - key: AKSHARE_TIMEOUT_SECONDS
        value: "4"
      - key: FAST_FALLBACK_FIRST
        value: "1"
      - key: PYTHONIOENCODING
        value: "utf-8"
      - key: TZ
        value: "Asia/Shanghai"
